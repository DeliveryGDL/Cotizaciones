<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>DELIVERY GDL · Cotizador</title>
<meta name="description" content="Generador de cotizaciones profesionales para DELIVERY GDL">
<meta name="theme-color" content="#FF6A1A">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cotizador GDL">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/styles.css">
</head>
<body>

<div class="app-shell">

  <!-- Top bar -->
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark">DG</span>
      <div class="brand-text">
        <strong id="brandName">DELIVERY GDL</strong>
        <small>Cotizador</small>
      </div>
    </div>
    <button class="icon-btn" id="settingsBtn" title="Configuración" aria-label="Configuración">⚙</button>
  </header>

  <!-- Tabs -->
  <nav class="tabs" role="tablist">
    <button class="tab active" data-tab="nueva" role="tab" aria-selected="true">Nueva</button>
    <button class="tab" data-tab="guardadas" role="tab" aria-selected="false">Activas <span class="tab-count" id="tabCount">0</span></button>
  </nav>

  <main class="views">

    <!-- ===================== VISTA: NUEVA COTIZACIÓN ===================== -->
    <section class="view active" id="view-nueva">

      <form id="quoteForm" class="quote-form" autocomplete="off">

        <div class="field-row">
          <div class="field">
            <label for="clientName">Cliente</label>
            <input type="text" id="clientName" placeholder="Nombre del cliente" required>
          </div>
          <div class="field field-sm">
            <label for="quoteDate">Fecha</label>
            <input type="date" id="quoteDate" required>
          </div>
        </div>

        <div class="section-label">
          <span>Productos</span>
          <span class="hint" id="itemCountHint">0 artículos</span>
        </div>

        <div id="itemsList" class="items-list"></div>

        <button type="button" id="addItemBtn" class="btn-add">
          <span class="plus">+</span> Agregar producto
        </button>

        <div class="section-label">
          <span>Descuento</span>
        </div>

        <div class="discount-box">
          <label class="switch-row">
            <input type="checkbox" id="discountEnabled">
            <span>Aplicar descuento a esta cotización</span>
          </label>
          <div class="discount-fields" id="discountFields" hidden>
            <select id="discountType">
              <option value="percent">Porcentaje (%)</option>
              <option value="fixed">Monto fijo ($)</option>
            </select>
            <input type="number" id="discountValue" min="0" step="0.01" placeholder="0">
          </div>
        </div>

        <div class="field">
          <label for="notes">Notas para el cliente (opcional)</label>
          <textarea id="notes" rows="2" placeholder="Ej. Tiempo de entrega 3-5 días hábiles, se solicita 50% de anticipo…"></textarea>
        </div>

      </form>

      <!-- ===== TICKET / PREVIEW (elemento firma) ===== -->
      <div class="ticket-wrap">
        <div class="ticket-edge top"></div>
        <div id="ticketPreview" class="ticket">
          <!-- generado por JS -->
        </div>
        <div class="ticket-edge bottom"></div>
      </div>

      <div class="action-bar">
        <button type="button" id="saveQuoteBtn" class="btn-secondary">Guardar cotización</button>
        <button type="button" id="pdfBtn" class="btn-primary">Generar PDF</button>
      </div>

    </section>

    <!-- ===================== VISTA: COTIZACIONES ACTIVAS ===================== -->
    <section class="view" id="view-guardadas">
      <div class="section-label">
        <span>Cotizaciones activas</span>
      </div>
      <div id="savedList" class="saved-list"></div>
      <p class="empty-msg" id="emptyMsg" hidden>Aún no tienes cotizaciones guardadas.<br>Crea una desde la pestaña “Nueva”.</p>
    </section>

  </main>
</div>

<!-- ===================== MODAL: CONFIGURACIÓN ===================== -->
<div class="modal-backdrop" id="settingsModal" hidden>
  <div class="modal">
    <div class="modal-head">
      <h2>Datos del negocio</h2>
      <button class="icon-btn" id="closeSettings" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-body">
      <div class="field">
        <label for="cfgName">Nombre del negocio</label>
        <input type="text" id="cfgName" placeholder="DELIVERY GDL">
      </div>
      <div class="field">
        <label for="cfgPhone">Teléfono / WhatsApp</label>
        <input type="text" id="cfgPhone" placeholder="33 1234 5678">
      </div>
      <div class="field">
        <label for="cfgZone">Zona / Dirección</label>
        <input type="text" id="cfgZone" placeholder="Guadalajara y zona metropolitana">
      </div>
      <div class="field">
        <label for="cfgFooter">Mensaje de cierre en el PDF</label>
        <input type="text" id="cfgFooter" placeholder="Gracias por tu preferencia">
      </div>
      <div class="field">
        <label for="cfgFolio">Siguiente folio</label>
        <input type="number" id="cfgFolio" min="1" step="1">
      </div>
    </div>
    <div class="modal-foot">
      <button class="btn-primary" id="saveSettingsBtn">Guardar</button>
    </div>
  </div>
</div>

<!-- ===================== MODAL: VISOR DE COTIZACIÓN GUARDADA ===================== -->
<div class="modal-backdrop" id="viewerModal" hidden>
  <div class="modal modal-wide">
    <div class="modal-head">
      <h2 id="viewerTitle">Cotización</h2>
      <button class="icon-btn" id="closeViewer" aria-label="Cerrar">✕</button>
    </div>
    <div class="modal-body">
      <div id="viewerTicketWrap" class="ticket-wrap">
        <div class="ticket-edge top"></div>
        <div id="viewerTicket" class="ticket"></div>
        <div class="ticket-edge bottom"></div>
      </div>
    </div>
    <div class="modal-foot modal-foot-split">
      <button class="btn-danger" id="deleteQuoteBtn">Eliminar</button>
      <div class="modal-foot-right">
        <button class="btn-secondary" id="markStatusBtn">Marcar como pedido</button>
        <button class="btn-primary" id="viewerPdfBtn">Descargar PDF</button>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="js/app.js"></script>
</body>
</html>
